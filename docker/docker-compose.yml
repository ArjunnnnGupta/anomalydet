# docker/docker-compose.yml — full cluster: 3-broker KRaft Kafka + Kafka UI + Spark standalone (1 master, 2 workers).
# Memory caps are sized for an 8 GB Mac with Docker Desktop at ~6 GB.
#   make cluster-up        (this file)
#   make cluster-up-lite   (docker-compose.lite.yml: 1 broker + 1 worker)

x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_LOG_RETENTION_HOURS: 48
  KAFKA_HEAP_OPTS: "-Xmx320m -Xms320m"

x-kafka-health: &kafka-health
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
  interval: 10s
  timeout: 10s
  retries: 12

x-spark: &spark
  build: ./spark
  image: adp-spark:3.5.3
  user: root
  volumes:
    - ..:/opt/app
  environment:
    SPARK_NO_DAEMONIZE: "true"
    SPARK_DAEMON_MEMORY: 256m

services:
  kafka-1:
    image: apache/kafka:3.8.0
    hostname: kafka-1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,EXTERNAL://localhost:9092
    volumes: [kafka1:/var/lib/kafka/data]
    mem_limit: 512m
    healthcheck: *kafka-health

  kafka-2:
    image: apache/kafka:3.8.0
    hostname: kafka-2
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092,EXTERNAL://localhost:9094
    volumes: [kafka2:/var/lib/kafka/data]
    mem_limit: 512m
    healthcheck: *kafka-health

  kafka-3:
    image: apache/kafka:3.8.0
    hostname: kafka-3
    ports: ["9096:9096"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092,EXTERNAL://localhost:9096
    volumes: [kafka3:/var/lib/kafka/data]
    mem_limit: 512m
    healthcheck: *kafka-health

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.0.0
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: cicids-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      JAVA_OPTS: "-Xmx192m"
    mem_limit: 320m
    depends_on:
      kafka-1: {condition: service_healthy}

  spark-master:
    <<: *spark
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8081"]
    ports:
      - "8081:8081"   # master UI
      - "4040:4040"   # streaming app UI
      - "4041:4041"   # training / batch app UI
    # The master container also hosts the drivers (client mode), hence the larger cap
    mem_limit: 2560m

  spark-worker-1:
    <<: *spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--cores", "2", "--memory", "1200m", "spark://spark-master:7077"]
    mem_limit: 1800m
    depends_on: [spark-master]

  spark-worker-2:
    <<: *spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--cores", "2", "--memory", "1200m", "spark://spark-master:7077"]
    mem_limit: 1800m
    depends_on: [spark-master]

volumes:
  kafka1:
  kafka2:
  kafka3:
